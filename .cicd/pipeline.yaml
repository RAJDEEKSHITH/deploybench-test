
jobs:
  checkout-proof:
    name: Repository Checkout Proof
    timeoutSeconds: 180
    maxAttempts: 1
    commands:
      - 'echo "========== CHECKOUT PROOF =========="'
      - 'echo "CONTAINER_HOSTNAME=$(hostname)"'
      - 'echo "WORKING_DIRECTORY=$(pwd)"'
      - 'echo "REPOSITORY_ROOT=$(git rev-parse --show-toplevel)"'
      - 'echo "CHECKED_OUT_COMMIT=$(git rev-parse HEAD)"'
      - 'echo "LATEST_COMMIT_DETAILS:"'
      - 'git log -1 --format="%H %s" HEAD'
      - 'echo "========== ALL COMMITTED FILES =========="'
      - 'git ls-tree -r --name-only HEAD'
      - 'git cat-file -e HEAD:main.js && echo MAIN_JS_EXISTS_IN_COMMIT'
      - 'git cat-file -e HEAD:.cicd/pipeline.yaml && echo PIPELINE_YAML_EXISTS_IN_COMMIT'
      - 'test -f main.js && echo MAIN_JS_CHECKOUT_VERIFIED'
      - 'test -f .cicd/pipeline.yaml && echo PIPELINE_YAML_CHECKOUT_VERIFIED'
      - 'echo CHECKOUT_PROOF_PASSED'

  runtime-smoke:
    name: Independent Container Runtime Test
    dependsOn:
      - checkout-proof
    timeoutSeconds: 180
    maxAttempts: 1
    commands:
      - 'echo "========== CONTAINER 2 =========="'
      - 'echo "CONTAINER_HOSTNAME=$(hostname)"'
      - 'echo "CHECKED_OUT_COMMIT=$(git rev-parse HEAD)"'
      - 'echo "========== NODE VERSION =========="'
      - 'node --version'
      - 'echo "========== NPM VERSION =========="'
      - 'npm --version'
      - 'node -e "console.log(\"NODE_RUNTIME_OK\")"'
      - 'echo LOG_STREAM_TEST_STARTED'
      - 'sleep 5'
      - 'echo LOG_STREAM_TEST_FINISHED'
      - 'echo RUNTIME_TEST_PASSED'

  repository-files-check:
    name: Verify Checked Out Files
    dependsOn:
      - runtime-smoke
    timeoutSeconds: 180
    maxAttempts: 1
    commands:
      - 'echo "========== CONTAINER 3 =========="'
      - 'echo "CONTAINER_HOSTNAME=$(hostname)"'
      - 'echo "CHECKED_OUT_COMMIT=$(git rev-parse HEAD)"'
      - 'git cat-file -e HEAD:main.js'
      - 'git cat-file -e HEAD:.cicd/pipeline.yaml'
      - 'test -f main.js && echo MAIN_JS_AVAILABLE_IN_WORKSPACE'
      - 'test -f .cicd/pipeline.yaml && echo PIPELINE_AVAILABLE_IN_WORKSPACE'
      - 'git ls-tree -r --name-only HEAD'
      - 'echo REPOSITORY_FILE_CHECK_PASSED'
